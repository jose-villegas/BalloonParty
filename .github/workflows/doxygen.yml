name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Assets/Source/**'
      - 'Docs/diagrams/**'
      - 'Docs/doxygen-custom.css'
      - 'Docs/doxygen-header.html'
      - 'Docs/doxygen-footer.html'
      - 'Doxyfile'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

# Publishes to the gh-pages branch (Pages source = branch, not Actions artifact) so the
# WebGL player can live at /play on the same site — a repo only serves one Pages site.
permissions:
  contents: write

# Shared with the WebGL deploy so the two never push to gh-pages at once. Cancelling is
# off: a queued docs run must not kill an in-flight player build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          # Install Doxygen 1.13.2 (latest stable binary) to avoid template mismatches
          wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz
          tar xzf doxygen-1.13.2.linux.bin.tar.gz
          sudo cp doxygen-1.13.2/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Render Graphviz diagrams
        run: |
          cd Docs/diagrams
          for f in *.dot; do
            dot -Tsvg "$f" -o "${f%.dot}.svg"
          done

      - name: Generate Doxygen
        run: doxygen Doxyfile

      # keep_files preserves /play, which this workflow does not build.
      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Docs/doxygen/html
          keep_files: true
          commit_message: 'Deploy Doxygen from ${{ github.sha }}'
